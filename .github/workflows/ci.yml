name: verification

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  application-and-cloud-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: capture_tracker
          POSTGRES_USER: capture_tracker
          POSTGRES_PASSWORD: capture_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U capture_tracker -d capture_tracker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://capture_tracker:capture_tracker@localhost:5432/capture_tracker
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-fictional-only-not-a-production-secret
      CAPTURE_TRACKER_ENVIRONMENT: test
      CAPTURE_TRACKER_EXECUTION_CONTEXT: ci
      CAPTURE_TRACKER_DEPLOYMENT_PROFILE: no-deploy
      CAPTURE_TRACKER_REAL_DATA_APPROVED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: git diff --exit-code -- package-lock.json
      - run: npm run cloud:postgres:verify:installed
      - run: npx prisma migrate deploy
      - run: npm run check:phase
      - run: npm run docs:verify
      - run: npm run cloud:config:verify
      - run: npm run cloud:phase-9b:verify
      - run: npm run cloud:runtime:verify
      - run: npm run dependency:separation:verify
      - run: npm run cloud:build
      - run: npm run cloud:postgres:verify:artifact
      - run: npm run cloud:artifact:inventory
      - run: npm run cloud:artifact:reachability
      - run: npm run cloud:bundle:verify
      - run: npm run client-secret:verify
      - run: npm run data-boundary:verify
      - run: npm run cloud:audit:report
      - run: node scripts/probe-linux-opennext-health.mjs
      - run: node scripts/prove-linux-opennext-gate1b.mjs
      - run: git diff --exit-code -- package-lock.json
      - name: Collect PostgreSQL service diagnostics
        if: always()
        shell: bash
        run: |
          service_id='${{ job.services.postgres.id }}'
          if [ -z "$service_id" ]; then
            echo "CI_SERVICE_DIAGNOSTIC service=postgres status=unavailable health=unavailable exitCode=unavailable"
            exit 0
          fi
          status="$(docker inspect --format '{{.State.Status}}' "$service_id" 2>/dev/null || printf unavailable)"
          health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}unavailable{{end}}' "$service_id" 2>/dev/null || printf unavailable)"
          exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$service_id" 2>/dev/null || printf unavailable)"
          echo "CI_SERVICE_DIAGNOSTIC service=postgres status=$status health=$health exitCode=$exit_code"
          docker logs --tail 40 "$service_id" 2>&1 | sed -E \
            -e 's#postgres(ql)?://[^[:space:]]+#[redacted-database-url]#Ig' \
            -e 's#(password|secret|token|api[_-]?key)[[:space:]]*[:=][^[:space:]]+#\1=[redacted]#Ig' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-worker-sanitized-evidence
          path: |
            .artifacts/cloud-worker-inventory.json
            .artifacts/runtime-audit-report.json
            .artifacts/linux-opennext-health-preflight.json
            .artifacts/linux-opennext-gate1b.json
          if-no-files-found: warn
          retention-days: 7
      - run: npm run container:verify
      - run: npm --prefix infra/aws ci
      - run: npm run infra:test
      - run: npm run infra:synth
